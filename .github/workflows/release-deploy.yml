---
name: Release / Deploy

on:
  workflow_call:
    secrets:
      cloudflare_api_token:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ matrix.site.name }}
    strategy:
      fail-fast: false
      matrix:
        site:
          - name: 8f4e.com
            artifact: 8f4e-website
            project: 8f4e-website
          - name: editor.8f4e.com
            artifact: editor-website
            project: 8f4e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download ${{ matrix.site.name }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.site.artifact }}
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: pages deploy dist --project-name=${{ matrix.site.project }} --branch=main
