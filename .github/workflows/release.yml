---
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/release-run.yml

  deploy:
    name: Deploy
    needs: release
    permissions: {}
    uses: ./.github/workflows/release-deploy.yml
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
